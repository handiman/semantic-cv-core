name: zizmor
on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  # The gate for pull requests, required as a status check in the branch ruleset. It fails on a
  # finding of high severity. A status check belongs to the commit it ran on, so the merge never
  # waits for results to be matched to the pull request, as it did with code scanning.
  zizmor:
    name: zizmor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          min-severity: high

  # All findings on master go to code scanning, so they show under Security.
  upload:
    name: zizmor (code scanning)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
